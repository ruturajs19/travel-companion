services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel_companion_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_companion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U travel -d travel_companion" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
